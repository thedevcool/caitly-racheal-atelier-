name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    name: Migrate, seed, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database only; real values live in Vercel's environment settings.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atelier
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/atelier
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Throwaway CI-only admin login (the hash is of E2E_ADMIN_PASSWORD below)
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD_HASH: JDJiJDEyJDczWlY4bHRIb0tjbjV3dnJ0dGN3OGVCQ1BlT1V1eXdseEc2WE1wTWdSMXRnRVIuUGtGdjIy
      E2E_ADMIN_PASSWORD: ci-test-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same steps as Vercel's build (see "vercel-build" in package.json)
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
